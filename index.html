<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gitnoob — a free, open-source git GUI</title>
  <meta name="description" content="A free, open-source git GUI for macOS, Windows and Linux. Built with Tauri, Rust and Vue." />
  <link rel="icon" type="image/png" href="app-icon.png" />
  <meta property="og:title" content="gitnoob" />
  <meta property="og:description" content="A free, open-source git GUI." />
  <meta property="og:image" content="docs/screenshots/main-window.png" />
  <style>
    :root {
      --bg: #0d1218;
      --surface: #131b24;
      --line: #1f2a36;
      --text: #e6edf3;
      --muted: #8b98a7;
      --accent: #3ba3db;
      --accent-hover: #55b3e6;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    /* Hero: the app itself is the background */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 48px 16px;
      overflow: hidden;
      isolation: isolate;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: -2%;
      z-index: -2;
      background: url("docs/screenshots/main-window.png") center top / cover no-repeat;
      filter: blur(1px) saturate(1.1);
      transform: scale(1.02);
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse at center, rgba(13, 18, 24, .5) 0%, rgba(13, 18, 24, .72) 60%, var(--bg) 100%),
        linear-gradient(to bottom, transparent 70%, var(--bg));
    }
    .hero-inner { text-align: center; max-width: 560px; }
    .hero img.icon { width: 88px; height: 88px; filter: drop-shadow(0 8px 24px rgba(0,0,0,.5)); }
    h1 {
      margin: 20px 0 8px;
      font-size: clamp(44px, 9vw, 72px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .tagline { margin: 0 0 36px; font-size: 19px; color: var(--muted); }

    .download {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 30px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 17px;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(59, 163, 219, .3);
      transition: background .15s, transform .15s;
    }
    .download:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .download svg { width: 20px; height: 20px; }
    .meta { margin-top: 14px; font-size: 14px; color: var(--muted); }
    .meta a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
    .meta a:hover { color: var(--text); }

    /* Screenshots */
    .shots {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 16px 96px;
      display: grid;
      gap: 96px;
    }
    figure { margin: 0; }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .5);
    }
    figcaption {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
      color: var(--muted);
    }
    figcaption strong { color: var(--text); font-weight: 600; }

    footer {
      border-top: 1px solid var(--line);
      padding: 28px 16px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }
    footer a { text-decoration: none; margin: 0 10px; }
    footer a:hover { color: var(--text); }

    @media (max-width: 600px) {
      .tagline { font-size: 17px; }
      .shots { gap: 64px; }
      figcaption { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <img class="icon" src="app-icon.png" alt="" />
      <h1>gitnoob</h1>
      <p class="tagline">A free, open-source git GUI.</p>
      <a id="download" class="download" href="https://github.com/AVMG20/gitnoob/releases/latest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg>
        <span id="download-label">Download</span>
      </a>
      <div class="meta">
        <span id="version"></span>
        <a href="https://github.com/AVMG20/gitnoob/releases/latest">All platforms</a>
      </div>
    </div>
  </header>

  <main class="shots">
    <figure>
      <img src="docs/screenshots/diff.png" alt="A diff open next to the staged and unstaged file lists" loading="lazy" width="1680" height="1040" />
      <figcaption><strong>Stage by file, hunk or line.</strong></figcaption>
    </figure>
    <figure>
      <img src="docs/screenshots/conflicts.png" alt="Conflict resolution with checkboxes for ours and theirs" loading="lazy" width="1568" height="731" />
      <figcaption><strong>Resolve conflicts with checkboxes.</strong></figcaption>
    </figure>
    <figure>
      <img src="docs/screenshots/review.png" alt="A pull request open for review inside the app" loading="lazy" width="1568" height="731" />
      <figcaption><strong>Review pull requests without leaving the app.</strong></figcaption>
    </figure>
  </main>

  <footer>
    <a href="https://github.com/AVMG20/gitnoob">GitHub</a>
    <a href="https://github.com/AVMG20/gitnoob/releases">Releases</a>
    <a href="https://github.com/AVMG20/gitnoob/blob/main/LICENSE">GPL-3.0</a>
  </footer>

  <script>
    // Point the button straight at the right file from the latest release.
    // If anything fails it stays a link to the releases page.
    (async () => {
      const ua = navigator.userAgent;
      const os = /Windows/i.test(ua) ? 'windows'
        : /Mac OS X|Macintosh/i.test(ua) && !/iPhone|iPad/i.test(ua) ? 'mac'
        : /Linux|X11/i.test(ua) && !/Android/i.test(ua) ? 'linux'
        : null;
      const wanted = {
        windows: { match: /_x64-setup\.exe$/, label: 'Download for Windows' },
        mac: { match: /_universal\.dmg$/, label: 'Download for macOS' },
        linux: { match: /_amd64\.AppImage$/, label: 'Download for Linux' },
      }[os];

      try {
        const res = await fetch('https://api.github.com/repos/AVMG20/gitnoob/releases/latest', {
          headers: { Accept: 'application/vnd.github+json' },
        });
        if (!res.ok) return;
        const release = await res.json();
        document.getElementById('version').textContent = release.tag_name + ' · ';
        if (!wanted) return;
        const asset = release.assets.find((a) => wanted.match.test(a.name));
        if (!asset) return;
        document.getElementById('download').href = asset.browser_download_url;
        document.getElementById('download-label').textContent = wanted.label;
      } catch {}
    })();
  </script>
</body>
</html>
