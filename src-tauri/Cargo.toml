[package]
name = "gitnoob"
version = "0.4.7"
description = "An open-source Git client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gitnoob_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features off: network transport comes from the git CLI, so we skip
# the openssl / libssh2 build dependencies entirely.
git2 = { version = "0.20", default-features = false }
# Watching the work tree, so a commit made in a terminal shows up without a
# click. Debouncing is done here rather than by a helper crate: the rules are
# specific to git and worth reading.
notify = "8"
# rustls rather than native-tls: no openssl in the build.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
] }
sha2 = { version = "0.10", default-features = false }

# Updating in place. The bundle the pipeline built is signed with the key whose
# public half is in tauri.conf.json, and the plugin refuses anything that does
# not verify — so "download from GitHub and run it" cannot be turned into
# "download from anywhere and run it".
tauri-plugin-updater = "2"
# Only so the app can restart itself once the new version is written.
tauri-plugin-process = "2"

# Tokens live in the OS keychain, never in the config file. The backing store
# differs per platform, so each one picks its own keyring feature.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
# Reaching the webview's own settings, for the one thing that cannot be asked
# for through Tauri: WebKitGTK animates a wheel flick and goes on easing after
# the fingers have stopped, which reads as the window lagging behind the scroll.
# The version follows whatever Tauri links against — two copies of this crate in
# one binary would not be talking about the same webview.
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
